name: dockseed-gitlab

services:
  gitlab:
    image: gitlab/gitlab-ce:${GITLAB_VERSION:?请在 .env 中配置 GITLAB_VERSION}
    container_name: dockseed-gitlab
    platform: ${GITLAB_PLATFORM:-linux/arm64}
    restart: "${GITLAB_RESTART_POLICY:-unless-stopped}"
    # 每次启动先检查已有数据，仅一次性的 compose run --rm 容器可显式初始化。
    # 初始化检查中的 -L 也会捕获悬空符号链接，不能借此绕过 PG_VERSION 检查。
    command:
      - /bin/bash
      - -ec
      - |
        if [ "$${GITLAB_ALLOW_INITIALIZATION:-false}" = true ]; then
          if [ -e /var/opt/gitlab/postgresql/data/PG_VERSION ] || [ -L /var/opt/gitlab/postgresql/data/PG_VERSION ]; then
            echo "Refusing to start GitLab: PG_VERSION already exists. Initialization requires a new database volume; see docs/recovery.md." >&2
            exit 1
          fi
        else
          for file in /etc/gitlab/gitlab-secrets.json /var/opt/gitlab/postgresql/data/PG_VERSION; do
            if [ ! -s "$$file" ]; then
              echo "Refusing to start GitLab: missing or empty $$file. Check storage; see docs/recovery.md." >&2
              exit 1
            fi
          done
        fi
        exec /assets/init-container
    shm_size: "256m"
    environment:
      # 不允许通过 .env 覆盖，确保正常容器始终执行启动检查。
      GITLAB_ALLOW_INITIALIZATION: "false"
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD:?请在 .env 中配置初始 root 密码}
      # GitLab 内置清理未匹配 PostgreSQL 的 .s.PGSQL.* socket 和锁文件，
      # 在 runit 启动前清理这些遗留运行态文件。
      GITLAB_PRE_RECONFIGURE_SCRIPT: |
        rm -f /var/opt/gitlab/postgresql/.s.PGSQL.*
      GITLAB_OMNIBUS_CONFIG: |
        external_url '${GITLAB_EXTERNAL_URL:-http://127.0.0.1:8929}'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        letsencrypt['enable'] = false
        gitlab_rails['gitlab_ssh_host'] = '${GITLAB_SSH_HOST:-127.0.0.1}'
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
        gitlab_rails['time_zone'] = '${GITLAB_TIME_ZONE:-Asia/Shanghai}'
        # Container Registry：仅在 .env 配置了 GITLAB_REGISTRY_EXTERNAL_URL 时启用。
        # 容器内监听明文 5050；HTTPS 由前置代理终止 TLS，可信内网也可用 HTTP 直连。
        registry_url = '${GITLAB_REGISTRY_EXTERNAL_URL:-}'
        unless registry_url.empty?
          registry_external_url registry_url
          gitlab_rails['registry_enabled'] = true
          registry_nginx['listen_port'] = 5050
          registry_nginx['listen_https'] = false
          # 上传重定向须与对外地址一致，兼容 HTTPS 代理和可信内网 HTTP 直连。
          registry_https = registry_url.start_with?('https://')
          registry_nginx['proxy_set_headers'] = {
            "X-Forwarded-Proto" => registry_https ? "https" : "http",
            "X-Forwarded-Ssl" => registry_https ? "on" : "off"
          }
        end
    ports:
      - "${GITLAB_BIND_ADDR:-127.0.0.1}:8929:80"
      - "${GITLAB_BIND_ADDR:-127.0.0.1}:2224:22"
      # 未启用 Registry 时仍映射到绑定地址上的随机端口，容器内无服务监听。
      # 绑定地址默认 127.0.0.1；Runner 直连或内网 HTTP Registry 可改为可达的内网地址。
      - target: 5050
        host_ip: ${GITLAB_REGISTRY_BIND_ADDR:-127.0.0.1}
        published: "${GITLAB_REGISTRY_EXTERNAL_URL:+${GITLAB_REGISTRY_PORT:-5050}}"
    volumes:
      - dockseed-gitlab-config:/etc/gitlab
      - dockseed-gitlab-logs:/var/log/gitlab
      - dockseed-gitlab-data:/var/opt/gitlab
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error --max-time 10 http://127.0.0.1/-/readiness >/dev/null
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 5m
    stop_grace_period: 10m

volumes:
  dockseed-gitlab-config:
    external: true
    name: dockseed-gitlab-config
  dockseed-gitlab-logs:
    external: true
    name: dockseed-gitlab-logs
  dockseed-gitlab-data:
    external: true
    name: dockseed-gitlab-data
